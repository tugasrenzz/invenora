<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061b49">
  <title>Invenora - Sistem Inventaris Barang</title>
  <link rel="icon" href="assets/invenora-logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-inner">
      <img src="assets/invenora-logo.png" alt="Invenora">
      <h1>Invenora</h1>
      <p>Sistem Inventaris Barang</p>
      <small>Dibuat untuk pengelolaan inventaris yang lebih teratur</small>
      <div class="loader"><span></span></div>
      <div class="loading-text">Memuat aplikasi...</div>
    </div>
  </div>

  <section id="authPage" class="auth-page hidden">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="assets/invenora-logo.png" alt="Invenora">
        <h1>Invenora</h1>
        <p>Masuk ke akun Anda</p>
      </div>

      <form id="loginForm" class="auth-form">
        <label>Username<input id="loginUsername" required autocomplete="username" placeholder="Masukkan username"></label>
        <label>Password<div class="password-wrap"><input id="loginPassword" type="password" required autocomplete="current-password" placeholder="Masukkan password"><button type="button" class="eye" data-target="loginPassword">◉</button></div></label>
        <button class="primary full" type="submit">Masuk</button>
      </form>
      <p id="loginMessage" class="form-message"></p>
      <p class="switch-auth">Belum punya akun? <button id="showRegister" class="link-btn">Daftar di sini</button></p>

      <form id="registerForm" class="auth-form hidden">
        <label>Nama lengkap<input id="regName" required placeholder="Nama lengkap"></label>
        <label>Username<input id="regUsername" required placeholder="Buat username"></label>
        <label>Password<input id="regPassword" type="password" minlength="4" required placeholder="Minimal 4 karakter"></label>
        <label>Konfirmasi Password<input id="regConfirm" type="password" minlength="4" required placeholder="Ulangi password"></label>
        <button class="primary full" type="submit">Buat Akun</button>
      </form>
      <p id="registerMessage" class="form-message"></p>
      <p id="backLogin" class="switch-auth hidden"><button class="link-btn">← Kembali ke login</button></p>
    </div>
  </section>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand">
        <img src="assets/invenora-logo.png" alt="">
        <div><b>Invenora</b><small>Inventory System</small></div>
      </div>
      <nav>
        <button class="nav-item active" data-page="dashboard">⌂ <span>Beranda</span></button>
        <button class="nav-item" data-page="items">▣ <span>Daftar Barang</span></button>
        <button class="nav-item" data-page="add">＋ <span>Tambah Barang</span></button>
        <button class="nav-item" data-page="history">◷ <span>Riwayat</span></button>
        <button class="nav-item" data-page="profile">♙ <span>Profil</span></button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <button id="mobileMenu" class="icon-btn">☰</button>
        <div>
          <h2 id="pageTitle">Beranda</h2>
          <p id="welcomeText">Selamat datang di Invenora</p>
        </div>
        <div class="top-user" id="topUser"></div>
      </header>

      <div id="content" class="content"></div>
    </main>
  </div>

  <div id="modalRoot"></div>
  <script src="script.js"></script>
</body>
</html>
